name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The launcher's whole UI lives in Rust, so the runner needs the Android
      # targets before Gradle has anything to package.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build the native core
        run: ./build-rust.sh

      - name: Build APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nxslauncher-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # A plain .apk on the release page, so installing needs no unzip step.
      - name: Attach the installable APK to the release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk NXSLauncher-1.0.2.apk
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            tag="v1.0.2"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" NXSLauncher-1.0.2.apk --clobber
          else
            echo "no release for $tag yet, keeping the artifact only"
          fi
