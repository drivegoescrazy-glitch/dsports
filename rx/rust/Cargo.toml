[package]
name = "nxs"
version = "1.0.9"
edition = "2021"
description = "NXS Launcher - native Rust port of the CardsNX layout"

[lib]
name = "nxs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nxs-preview"
path = "src/bin/preview.rs"
required-features = ["preview"]

# Composes the GL scene on the host so the layer path can be checked off-device.
[[bin]]
name = "gpu-shot"
path = "src/bin/gpu-shot.rs"
required-features = ["preview"]

[features]
preview = ["tiny-skia/png-format"]

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
ab_glyph = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = "0.9"
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.14"

[target.'cfg(not(target_os = "android"))'.dependencies]
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
