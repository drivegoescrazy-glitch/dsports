name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid android-actions/setup-android: its current setup script tries
      # to install the removed legacy SDK package "tools" and fails.
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="${ANDROID_HOME}" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk dsports-release.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsports-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "DSports ${{ github.ref_name }}"
          generate_release_notes: true
          files: dsports-release.apk
